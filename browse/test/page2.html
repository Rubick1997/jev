<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme - Pricing</title></head>
<body>
  <nav><a href="fixture.html">Back to sign in</a></nav>
  <h1>Pricing</h1>
  <p>Starter is free. Team costs $12 per seat per month.</p>
  <label for="seats">Seats</label> <input id="seats" type="number" value="1">
  <button type="button" onclick="document.getElementById('q').textContent='Quote: $'+(12*document.getElementById('seats').value)+' per month'">Get quote</button>
  <p id="q" role="status"></p>
</body>
</html>
