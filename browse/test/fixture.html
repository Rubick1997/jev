<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme - Sign in</title>
<style>body{font-family:sans-serif;max-width:32rem;margin:2rem auto}label{display:block;margin:.6rem 0}.hidden{display:none}</style>
</head>
<body>
  <nav><a href="page2.html">Pricing</a> · <a href="#help">Help</a></nav>
  <h1>Sign in to Acme</h1>
  <form id="login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password">
    <label for="region">Region</label>
    <select id="region" name="region">
      <option value="">Choose a region</option>
      <option value="us">United States</option>
      <option value="eu">Europe</option>
      <option value="apac">Asia Pacific</option>
    </select>
    <p>
      <button type="submit">Sign in</button>
      <button type="button" id="create">Create account</button>
    </p>
  </form>
  <p id="msg" role="status"></p>
  <button class="hidden">Hidden button</button>
  <script>
    document.getElementById('login').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const region = document.getElementById('region').value;
      location.href = 'dashboard.html?email=' + encodeURIComponent(email) + '&region=' + encodeURIComponent(region);
    });
    document.getElementById('create').addEventListener('click', () => {
      document.getElementById('msg').textContent = 'Create account was clicked (wrong button).';
    });
  </script>
</body>
</html>
